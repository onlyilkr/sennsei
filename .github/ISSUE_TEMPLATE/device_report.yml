name: Device report
description: Tell us how Sennsei behaves with a Sennheiser model other than the ACCENTUM
labels: [device]
body:
  - type: markdown
    attributes:
      value: |
        Sennsei is built and tested on the ACCENTUM. Reports from other Sennheiser headphones help decide which models can be supported.
        The probe's default run is **read-only**: it connects to the headphones, asks which services and settings they report and writes a log. It changes no setting. This holds only while you leave `SENNSEI_MODE` unset (`eq1-read` and `dump-sdp` are read-only too). **Do not set `SENNSEI_MODE` to `eq1-write` or `eq1-restore`: those modes WRITE to the headphones.**
        To run it from a clone of the repository, with the headphones connected and Sennsei quit: `bash Tools/probe/run_probe.sh`. It prints the log file's path (inside `~/Library/Application Support/Sennsei/probe`). macOS asks for Bluetooth permission for `SennseiProbe`.
        The log contains your headphones' Bluetooth address and name. Replace the address with `XX:XX:XX:XX:XX:XX` before pasting.
  - type: input
    id: model
    attributes:
      label: Headphone model
      placeholder: "Momentum 4 Wireless"
    validations:
      required: true
  - type: input
    id: firmware
    attributes:
      label: Firmware version
      description: "Shown in the Sennheiser Smart Control app."
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "26.1"
    validations:
      required: true
  - type: textarea
    id: worked
    attributes:
      label: What worked and what did not
      description: For example connecting, noise control, equalizer, battery. Say which ones you tried.
    validations:
      required: true
  - type: textarea
    id: probe
    attributes:
      label: SennseiProbe output
      description: What `bash Tools/probe/run_probe.sh` printed, and the log file's contents if it is short (attach it if it is long).
      render: text
    validations:
      required: true
  - type: checkboxes
    id: redacted
    attributes:
      label: Before you submit
      options:
        - label: I replaced Bluetooth addresses, serial numbers and my user name with placeholders.
          required: true
